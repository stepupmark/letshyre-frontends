name: Blog

on:
  pull_request:
    paths:
      - apps/marketing/content/**
      - apps/marketing/scripts/blog-*.ts

permissions:
  contents: read

concurrency:
  group: blog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the base branch too, so the check can tell a revised post from a new one
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup

      # annotates the PR's files; dead links are warnings, since other sites go down for a while
      - env:
          BASE: origin/${{ github.base_ref }}
        run: pnpm --filter marketing blog:check --links --ci --base "$BASE"
