name: Blog

on:
  pull_request:
    paths:
      - apps/marketing/content/**
      - apps/marketing/scripts/blog-*.ts

concurrency:
  group: blog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the base branch too, so the check can tell a revised post from a new one
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # annotates the PR's files; dead links are warnings, since other sites go down for a while
      - run: pnpm --filter marketing blog:check --links --ci --base origin/${{ github.base_ref }}
