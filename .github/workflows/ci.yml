name: CI

# Pull requests run only the apps their changes reach, in Chromium (desktop and mobile).
# main runs everything, WebKit included, alongside the deploy; a manual deploy calls it first.
# Branch protection requires the `ci` job, the one check that waits for all the others.

on:
  pull_request:
  push:
    branches: [main, "migration/**"]
  workflow_call:

permissions:
  contents: read

concurrency:
  # a manual deploy calls this on main too, and must not cancel or be cancelled by the push run
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_ENV: development
  VITE_SITE_URL: http://localhost:4173
  VITE_APP_URL: http://localhost:5175
  VITE_API_BASE_URL: https://api.letshyre.ai
  VITE_INDEXABLE: "false"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.affected.outputs.apps }}
      scope: ${{ steps.affected.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # turbo is all this job needs
      - run: pnpm install --frozen-lockfile --filter letshyre

      - id: affected
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # turbo can't see that this file changed, so a change to it runs everything
          if [ "$EVENT" != pull_request ] || git diff --name-only "$BASE"...HEAD | grep -qx .github/workflows/ci.yml; then
            echo 'apps=["marketing","app","admin"]' >> "$GITHUB_OUTPUT"
            echo 'scope=' >> "$GITHUB_OUTPUT"
          else
            apps=$(pnpm --silent turbo ls --affected --filter='./apps/*' --output=json | jq -c '[.packages.items[].name]')
            echo "apps=$apps" >> "$GITHUB_OUTPUT"
            echo 'scope=--affected' >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # --affected compares against the base branch
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-checks-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-checks-

      - env:
          SCOPE: ${{ needs.changes.outputs.scope }}
        run: pnpm turbo run lint typecheck test $SCOPE --cache-dir=.turbo/cache

      - run: pnpm ui:drift

      - run: pnpm test:edge

      - run: pnpm test:deploy

      - run: pnpm knip

  e2e:
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    env:
      # admin has only the chromium project; mobile is Chromium too
      BROWSERS: ${{ (github.event_name == 'pull_request' || matrix.app == 'admin') && 'chromium' || 'chromium webkit' }}
      PROJECTS: ${{ github.event_name == 'pull_request' && matrix.app != 'admin' && '--project=chromium --project=mobile' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # sitemap lastmod comes from git log
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ matrix.app }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ matrix.app }}-

      - run: pnpm turbo run build --filter=${{ matrix.app }} --cache-dir=.turbo/cache

      - run: pnpm --filter ${{ matrix.app }} exec playwright install --with-deps $BROWSERS

      - run: pnpm --filter ${{ matrix.app }} exec playwright test $PROJECTS

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.app }}
          path: apps/${{ matrix.app }}/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  lighthouse:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.apps), 'marketing')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-lighthouse-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-lighthouse-
            turbo-${{ runner.os }}-marketing-

      # its own build, so it runs beside the marketing e2e instead of after it
      - run: pnpm turbo run build --filter=marketing --cache-dir=.turbo/cache

      - run: pnpm --filter marketing lighthouse

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: apps/marketing/lighthouse-report
          retention-days: 14
          if-no-files-found: ignore

  # skipped jobs report no status, so branch protection requires this one instead
  ci:
    needs: [changes, checks, e2e, lighthouse]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: test "$FAILED" = false
