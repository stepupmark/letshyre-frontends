name: CI

# Pull requests run lint, typecheck, unit tests and the builds for the apps their changes reach,
# plus Lighthouse when marketing is one of them. Playwright is paused. On main, the Deploy workflow
# calls this before it ships, for all three apps. `ci` is the one job that waits for all the others.

on:
  pull_request:
  push:
    branches: ["migration/**"]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # a newer push replaces a pull request's run; a deploy's run always finishes
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VITE_ENV: development
  VITE_SITE_URL: http://localhost:4173
  VITE_APP_URL: http://localhost:5175
  VITE_API_BASE_URL: https://api.letshyre.ai
  VITE_INDEXABLE: "false"

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.affected.outputs.apps }}
      scope: ${{ steps.affected.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # turbo is all this job needs
      - uses: ./.github/actions/setup
        with:
          filter: letshyre

      - id: affected
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # turbo can't see the pipeline or its scripts, so a change to them runs everything
          if [ "$EVENT" != pull_request ] || git diff --name-only "$BASE"...HEAD | grep -qE '^(\.github|tooling)/'; then
            echo 'apps=["marketing","app","admin"]' >> "$GITHUB_OUTPUT"
            echo 'scope=' >> "$GITHUB_OUTPUT"
          else
            apps=$(pnpm --silent turbo ls --affected --filter='./apps/*' --output=json | jq -c '[.packages.items[].name]')
            echo "apps=$apps" >> "$GITHUB_OUTPUT"
            echo 'scope=--affected' >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # --affected compares against the base branch
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-checks-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-checks-

      - env:
          SCOPE: ${{ needs.changes.outputs.scope }}
        run: pnpm turbo run lint typecheck test $SCOPE --cache-dir=.turbo/cache

      # the deploy scripts and edge functions sit outside the workspaces turbo runs
      - run: pnpm lint:tooling
      - run: pnpm typecheck:tooling
      - run: pnpm test:edge
      - run: pnpm test:deploy
      - run: pnpm ui:drift
      # knip resolves the apps' ./+types imports; a cached or skipped typecheck doesn't write them
      - run: pnpm --filter "./apps/*" exec react-router typegen
      - run: pnpm knip

  # Playwright is paused for speed
  build:
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # sitemap lastmod comes from git log
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ matrix.app }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ matrix.app }}-

      - run: pnpm turbo run build --filter=${{ matrix.app }} --cache-dir=.turbo/cache

  lighthouse:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.apps), 'marketing')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-lighthouse-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-lighthouse-
            turbo-${{ runner.os }}-marketing-

      # its own build, so it runs beside the marketing build job
      - run: pnpm turbo run build --filter=marketing --cache-dir=.turbo/cache

      - run: pnpm --filter marketing lighthouse

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: apps/marketing/lighthouse-report
          retention-days: 14
          if-no-files-found: ignore

  # skipped jobs report no status, so branch protection requires this one instead
  ci:
    needs: [changes, checks, build, lighthouse]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: test "$FAILED" = false
