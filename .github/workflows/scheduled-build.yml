name: Scheduled build

# Posts dated in the future go live with the first production build on or after their date
# (ADR 0021), so production rebuilds every day just after midnight UTC.
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the production deploy
        env:
          HOOK: ${{ secrets.MARKETING_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::MARKETING_DEPLOY_HOOK isn't set, so scheduled posts wait for the next deploy"
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 -X POST "$HOOK"
