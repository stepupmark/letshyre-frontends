<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="Outfit, system-ui, -apple-system, Segoe UI, sans-serif">
  <text x="40" y="50" font-size="14" font-weight="600" fill="#fafafa">Increased their use of AI tools</text><rect x="40" y="62" width="560" height="18" rx="9" fill="#33333a"/><rect x="40" y="62" width="364" height="18" rx="9" fill="#3a5a96"/><text x="416.0" y="78" font-size="22" font-weight="600" fill="#fafafa">65%</text><text x="40" y="116" font-size="14" font-weight="600" fill="#fafafa">Say final hiring decisions must stay human-led</text><rect x="40" y="128" width="560" height="18" rx="9" fill="#33333a"/><rect x="40" y="128" width="442" height="18" rx="9" fill="#4d86ff"/><text x="494.4" y="144" font-size="22" font-weight="600" fill="#fafafa">79%</text><text x="40" y="182" font-size="14" font-weight="600" fill="#fafafa">Say salary negotiation needs a person involved</text><rect x="40" y="194" width="560" height="18" rx="9" fill="#33333a"/><rect x="40" y="194" width="403" height="18" rx="9" fill="#4d86ff"/><text x="455.2" y="210" font-size="22" font-weight="600" fill="#fafafa">72%</text><text x="40" y="248" font-size="14" font-weight="600" fill="#fafafa">Want automation to run every stage</text><rect x="40" y="260" width="560" height="18" rx="9" fill="#33333a"/><text x="52" y="274" font-size="13" font-weight="600" fill="#8fb3ff">Not one respondent</text>
</svg>
