<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 248" width="720" height="248" font-family="Outfit, system-ui, -apple-system, Segoe UI, sans-serif">
  <text x="40" y="44" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#a1a1aa">AN EXAMPLE 39-DAY HIRE</text>
  <rect x="40" y="56" width="14" height="14" rx="3" fill="#4d86ff"/>
  <text x="60" y="68" font-size="13" fill="#fafafa">Someone working on it, 16 days</text>
  <rect x="300" y="56" width="14" height="14" rx="3" fill="#52525b"/>
  <text x="320" y="68" font-size="13" fill="#fafafa">Waiting for someone, 23 days</text>
  <rect x="41.0" y="92" width="30.8" height="42" rx="6" fill="#4d86ff"/><text x="56" y="160" font-size="12" font-weight="600" text-anchor="middle" fill="#fafafa">Write the role</text><text x="56" y="176" font-size="12" text-anchor="middle" fill="#a1a1aa">2d</text><rect x="73.8" y="92" width="63.6" height="42" rx="6" fill="#52525b"/><rect x="139.5" y="92" width="96.5" height="42" rx="6" fill="#4d86ff"/><text x="188" y="160" font-size="12" font-weight="600" text-anchor="middle" fill="#fafafa">Screen</text><text x="188" y="176" font-size="12" text-anchor="middle" fill="#a1a1aa">6d</text><rect x="237.9" y="92" width="80.1" height="42" rx="6" fill="#52525b"/><rect x="320.0" y="92" width="63.6" height="42" rx="6" fill="#4d86ff"/><text x="352" y="160" font-size="12" font-weight="600" text-anchor="middle" fill="#fafafa">Interview</text><text x="352" y="176" font-size="12" text-anchor="middle" fill="#a1a1aa">4d</text><rect x="385.6" y="92" width="96.5" height="42" rx="6" fill="#52525b"/><rect x="484.1" y="92" width="14.4" height="42" rx="6" fill="#4d86ff"/><text x="491" y="160" font-size="12" font-weight="600" text-anchor="middle" fill="#fafafa">Decide</text><text x="491" y="176" font-size="12" text-anchor="middle" fill="#a1a1aa">1d</text><rect x="500.5" y="92" width="80.1" height="42" rx="6" fill="#52525b"/><rect x="582.5" y="92" width="47.2" height="42" rx="6" fill="#4d86ff"/><text x="606" y="160" font-size="12" font-weight="600" text-anchor="middle" fill="#fafafa">Offer</text><text x="606" y="176" font-size="12" text-anchor="middle" fill="#a1a1aa">3d</text><rect x="631.8" y="92" width="47.2" height="42" rx="6" fill="#52525b"/>
  <line x1="40" y1="206" x2="680" y2="206" stroke="#3f3f46" stroke-width="1"/>
  <text x="40" y="232" font-size="13" fill="#a1a1aa">Day 1</text>
  <text x="680" y="232" font-size="13" text-anchor="end" fill="#a1a1aa">Day 39</text>
</svg>
