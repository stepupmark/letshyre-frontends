<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 264" width="720" height="264" font-family="Outfit, system-ui, -apple-system, Segoe UI, sans-serif">
  <text x="40" y="36" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#a1a1aa">THE THIRTY-SECOND ANSWER (EXAMPLE)</text>
  <rect x="40" y="56" width="160" height="148" rx="14" fill="#18181b" stroke="#3f3f46" stroke-width="2"/><circle cx="70" cy="86" r="12" fill="#22345a"/><text x="70" y="91" font-size="13" font-weight="600" text-anchor="middle" fill="#8fb3ff">1</text><text x="90" y="90" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#a1a1aa">WHAT HAPPENED</text><text x="60" y="132" font-size="13" fill="#fafafa">I took eight months</text><text x="60" y="151" font-size="13" fill="#fafafa">off to care for my</text><text x="60" y="170" font-size="13" fill="#fafafa">father after surgery.</text><rect x="215" y="56" width="200" height="148" rx="14" fill="#18181b" stroke="#3f3f46" stroke-width="2"/><circle cx="245" cy="86" r="12" fill="#22345a"/><text x="245" y="91" font-size="13" font-weight="600" text-anchor="middle" fill="#8fb3ff">2</text><text x="265" y="90" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#a1a1aa">WHAT CHANGED</text><text x="235" y="132" font-size="13" fill="#fafafa">He's recovered, and the</text><text x="235" y="151" font-size="13" fill="#fafafa">family has support in</text><text x="235" y="170" font-size="13" fill="#fafafa">place now.</text><rect x="430" y="56" width="250" height="148" rx="14" fill="#4d86ff" stroke="#4d86ff" stroke-width="2"/><circle cx="460" cy="86" r="12" fill="#ffffff"/><text x="460" y="91" font-size="13" font-weight="600" text-anchor="middle" fill="#4d86ff">3</text><text x="480" y="90" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#ffffff">WHY NOW</text><text x="450" y="132" font-size="13" fill="#ffffff">I'm ready to work full-time,</text><text x="450" y="151" font-size="13" fill="#ffffff">and this role is the kind of</text><text x="450" y="170" font-size="13" fill="#ffffff">work I want to get back to.</text>
  <line x1="40" y1="226" x2="680" y2="226" stroke="#3f3f46" stroke-width="1"/>
  <text x="40" y="250" font-size="13" fill="#a1a1aa">Shortest</text>
  <text x="680" y="250" font-size="13" font-weight="600" text-anchor="end" fill="#8fb3ff">Longest, and where you stop</text>
</svg>
