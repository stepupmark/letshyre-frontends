<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="Outfit, system-ui, -apple-system, Segoe UI, sans-serif">
  <rect x="40" y="214" width="154" height="22" rx="10" fill="#22345a" stroke="#3a5a96" stroke-width="2"/><text x="40" y="156" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#a1a1aa">STEP 1</text><text x="40" y="178" font-size="14" font-weight="600" fill="#fafafa">Mentor one person</text><text x="40" y="198" font-size="14" font-weight="600" fill="#fafafa">through real work</text><rect x="202" y="174" width="154" height="62" rx="10" fill="#3a5a96"/><text x="202" y="116" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#a1a1aa">STEP 2</text><text x="202" y="138" font-size="14" font-weight="600" fill="#fafafa">Run a meeting or</text><text x="202" y="158" font-size="14" font-weight="600" fill="#fafafa">process for the team</text><rect x="364" y="134" width="154" height="102" rx="10" fill="#3a5a96"/><text x="364" y="76" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#a1a1aa">STEP 3</text><text x="364" y="98" font-size="14" font-weight="600" fill="#fafafa">Own a decision</text><text x="364" y="118" font-size="14" font-weight="600" fill="#fafafa">beyond your tasks</text><rect x="526" y="94" width="154" height="142" rx="10" fill="#4d86ff"/><text x="526" y="36" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#8fb3ff">STEP 4</text><text x="526" y="58" font-size="14" font-weight="600" fill="#fafafa">Lead a project that</text><text x="526" y="78" font-size="14" font-weight="600" fill="#fafafa">others build</text>
  <line x1="40" y1="236" x2="680" y2="236" stroke="#3f3f46" stroke-width="1"/>
  <text x="40" y="262" font-size="13" fill="#a1a1aa">Easiest to start</text>
  <text x="680" y="262" font-size="13" font-weight="600" text-anchor="end" fill="#8fb3ff">Closest to the real job</text>
</svg>
