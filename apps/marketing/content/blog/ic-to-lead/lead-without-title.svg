<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="Outfit, system-ui, -apple-system, Segoe UI, sans-serif">
  <rect x="40" y="214" width="154" height="22" rx="10" fill="#dbe6fe" stroke="#a9c3fb" stroke-width="2"/><text x="40" y="156" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#71717a">STEP 1</text><text x="40" y="178" font-size="14" font-weight="600" fill="#18181b">Mentor one person</text><text x="40" y="198" font-size="14" font-weight="600" fill="#18181b">through real work</text><rect x="202" y="174" width="154" height="62" rx="10" fill="#a9c3fb"/><text x="202" y="116" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#71717a">STEP 2</text><text x="202" y="138" font-size="14" font-weight="600" fill="#18181b">Run a meeting or</text><text x="202" y="158" font-size="14" font-weight="600" fill="#18181b">process for the team</text><rect x="364" y="134" width="154" height="102" rx="10" fill="#a9c3fb"/><text x="364" y="76" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#71717a">STEP 3</text><text x="364" y="98" font-size="14" font-weight="600" fill="#18181b">Own a decision</text><text x="364" y="118" font-size="14" font-weight="600" fill="#18181b">beyond your tasks</text><rect x="526" y="94" width="154" height="142" rx="10" fill="#266fff"/><text x="526" y="36" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#1d5ce0">STEP 4</text><text x="526" y="58" font-size="14" font-weight="600" fill="#18181b">Lead a project that</text><text x="526" y="78" font-size="14" font-weight="600" fill="#18181b">others build</text>
  <line x1="40" y1="236" x2="680" y2="236" stroke="#e4e4e7" stroke-width="1"/>
  <text x="40" y="262" font-size="13" fill="#71717a">Easiest to start</text>
  <text x="680" y="262" font-size="13" font-weight="600" text-anchor="end" fill="#1d5ce0">Closest to the real job</text>
</svg>
