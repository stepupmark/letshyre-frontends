<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="Outfit, system-ui, -apple-system, Segoe UI, sans-serif">
  <text x="40" y="40" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#a1a1aa">INDIVIDUAL CONTRIBUTOR</text>
  <text x="394" y="40" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#8fb3ff">LEAD</text>
  <rect x="40" y="64" width="290" height="44" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/><text x="58" y="91" font-size="14" fill="#a1a1aa">Measure your own output</text><line x1="344" y1="86" x2="380" y2="86" stroke="#3a5a96" stroke-width="2.5" stroke-linecap="round"/><path d="M372 80 L380 86 L372 92" fill="none" stroke="#3a5a96" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="394" y="64" width="286" height="44" rx="10" fill="#141a26" stroke="#3a5a96" stroke-width="1.5"/><text x="412" y="91" font-size="14" font-weight="600" fill="#fafafa">Measure the team's output</text><rect x="40" y="122" width="290" height="44" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/><text x="58" y="149" font-size="14" fill="#a1a1aa">Solve the hard problem yourself</text><line x1="344" y1="144" x2="380" y2="144" stroke="#4d86ff" stroke-width="2.5" stroke-linecap="round"/><path d="M372 138 L380 144 L372 150" fill="none" stroke="#4d86ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="394" y="122" width="286" height="44" rx="10" fill="#4d86ff" stroke="#4d86ff" stroke-width="1.5"/><text x="412" y="149" font-size="14" font-weight="600" fill="#ffffff">Make sure it gets solved</text><rect x="40" y="180" width="290" height="44" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/><text x="58" y="207" font-size="14" fill="#a1a1aa">Get feedback a few times a year</text><line x1="344" y1="202" x2="380" y2="202" stroke="#3a5a96" stroke-width="2.5" stroke-linecap="round"/><path d="M372 196 L380 202 L372 208" fill="none" stroke="#3a5a96" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="394" y="180" width="286" height="44" rx="10" fill="#141a26" stroke="#3a5a96" stroke-width="1.5"/><text x="412" y="207" font-size="14" font-weight="600" fill="#fafafa">Give feedback every week</text><rect x="40" y="238" width="290" height="44" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/><text x="58" y="265" font-size="14" fill="#a1a1aa">Own your tasks</text><line x1="344" y1="260" x2="380" y2="260" stroke="#3a5a96" stroke-width="2.5" stroke-linecap="round"/><path d="M372 254 L380 260 L372 266" fill="none" stroke="#3a5a96" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="394" y="238" width="286" height="44" rx="10" fill="#141a26" stroke="#3a5a96" stroke-width="1.5"/><text x="412" y="265" font-size="14" font-weight="600" fill="#fafafa">Own the priorities</text>
  <text x="40" y="304" font-size="13" fill="#a1a1aa">The highlighted row is the one most new leads find hardest to let go of.</text>
</svg>
