<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="Outfit, system-ui, -apple-system, Segoe UI, sans-serif">
  <text x="40" y="40" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#71717a">INDIVIDUAL CONTRIBUTOR</text>
  <text x="394" y="40" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#1d5ce0">LEAD</text>
  <rect x="40" y="64" width="290" height="44" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/><text x="58" y="91" font-size="14" fill="#71717a">Measure your own output</text><line x1="344" y1="86" x2="380" y2="86" stroke="#a9c3fb" stroke-width="2.5" stroke-linecap="round"/><path d="M372 80 L380 86 L372 92" fill="none" stroke="#a9c3fb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="394" y="64" width="286" height="44" rx="10" fill="#f3f7ff" stroke="#a9c3fb" stroke-width="1.5"/><text x="412" y="91" font-size="14" font-weight="600" fill="#18181b">Measure the team's output</text><rect x="40" y="122" width="290" height="44" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/><text x="58" y="149" font-size="14" fill="#71717a">Solve the hard problem yourself</text><line x1="344" y1="144" x2="380" y2="144" stroke="#266fff" stroke-width="2.5" stroke-linecap="round"/><path d="M372 138 L380 144 L372 150" fill="none" stroke="#266fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="394" y="122" width="286" height="44" rx="10" fill="#266fff" stroke="#266fff" stroke-width="1.5"/><text x="412" y="149" font-size="14" font-weight="600" fill="#ffffff">Make sure it gets solved</text><rect x="40" y="180" width="290" height="44" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/><text x="58" y="207" font-size="14" fill="#71717a">Get feedback a few times a year</text><line x1="344" y1="202" x2="380" y2="202" stroke="#a9c3fb" stroke-width="2.5" stroke-linecap="round"/><path d="M372 196 L380 202 L372 208" fill="none" stroke="#a9c3fb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="394" y="180" width="286" height="44" rx="10" fill="#f3f7ff" stroke="#a9c3fb" stroke-width="1.5"/><text x="412" y="207" font-size="14" font-weight="600" fill="#18181b">Give feedback every week</text><rect x="40" y="238" width="290" height="44" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/><text x="58" y="265" font-size="14" fill="#71717a">Own your tasks</text><line x1="344" y1="260" x2="380" y2="260" stroke="#a9c3fb" stroke-width="2.5" stroke-linecap="round"/><path d="M372 254 L380 260 L372 266" fill="none" stroke="#a9c3fb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="394" y="238" width="286" height="44" rx="10" fill="#f3f7ff" stroke="#a9c3fb" stroke-width="1.5"/><text x="412" y="265" font-size="14" font-weight="600" fill="#18181b">Own the priorities</text>
  <text x="40" y="304" font-size="13" fill="#71717a">The highlighted row is the one most new leads find hardest to let go of.</text>
</svg>
