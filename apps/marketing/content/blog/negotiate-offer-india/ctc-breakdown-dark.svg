<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 312" width="720" height="312" font-family="Outfit, system-ui, -apple-system, Segoe UI, sans-serif">
  <text x="40" y="36" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#a1a1aa">AN EXAMPLE ₹20 LAKH CTC</text>
  <rect x="41.0" y="56" width="520.2" height="40" rx="6" fill="#4d86ff"/><rect x="563.2" y="56" width="62.0" height="40" rx="6" fill="#3a5a96"/><rect x="627.2" y="56" width="36.4" height="40" rx="6" fill="#22345a"/><rect x="665.6" y="56" width="13.4" height="40" rx="6" fill="#52525b"/>
  <rect x="40" y="124" width="14" height="14" rx="3" fill="#4d86ff"/><text x="64" y="136" font-size="14" font-weight="600" fill="#fafafa">Fixed pay</text><text x="250" y="136" font-size="14" fill="#fafafa">₹16.32 lakh</text><text x="380" y="136" font-size="13" fill="#a1a1aa">Paid every month</text><rect x="40" y="154" width="14" height="14" rx="3" fill="#3a5a96"/><text x="64" y="166" font-size="14" font-weight="600" fill="#fafafa">Variable pay</text><text x="250" y="166" font-size="14" fill="#fafafa">₹2 lakh</text><text x="380" y="166" font-size="13" fill="#a1a1aa">Only if targets are met</text><rect x="40" y="184" width="14" height="14" rx="3" fill="#22345a"/><text x="64" y="196" font-size="14" font-weight="600" fill="#fafafa">Employer PF</text><text x="250" y="196" font-size="14" fill="#fafafa">₹1.2 lakh</text><text x="380" y="196" font-size="13" fill="#a1a1aa">Goes into your PF account</text><rect x="40" y="214" width="14" height="14" rx="3" fill="#52525b"/><text x="64" y="226" font-size="14" font-weight="600" fill="#fafafa">Gratuity</text><text x="250" y="226" font-size="14" fill="#fafafa">₹0.48 lakh</text><text x="380" y="226" font-size="13" fill="#a1a1aa">Usually only after five years</text>
  <line x1="40" y1="248" x2="680" y2="248" stroke="#3f3f46" stroke-width="1"/>
  <text x="40" y="276" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#a1a1aa">IN YOUR ACCOUNT EACH MONTH, AT MOST</text>
  <text x="40" y="300" font-size="20" font-weight="600" fill="#8fb3ff">₹1,36,000</text>
  <text x="150" y="300" font-size="13" fill="#a1a1aa">before your own PF contribution, professional tax and income tax</text>
</svg>
