<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 312" width="720" height="312" font-family="Outfit, system-ui, -apple-system, Segoe UI, sans-serif">
  <text x="40" y="36" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#71717a">AN EXAMPLE ₹20 LAKH CTC</text>
  <rect x="41.0" y="56" width="520.2" height="40" rx="6" fill="#266fff"/><rect x="563.2" y="56" width="62.0" height="40" rx="6" fill="#a9c3fb"/><rect x="627.2" y="56" width="36.4" height="40" rx="6" fill="#dbe6fe"/><rect x="665.6" y="56" width="13.4" height="40" rx="6" fill="#d4d4d8"/>
  <rect x="40" y="124" width="14" height="14" rx="3" fill="#266fff"/><text x="64" y="136" font-size="14" font-weight="600" fill="#18181b">Fixed pay</text><text x="250" y="136" font-size="14" fill="#18181b">₹16.32 lakh</text><text x="380" y="136" font-size="13" fill="#71717a">Paid every month</text><rect x="40" y="154" width="14" height="14" rx="3" fill="#a9c3fb"/><text x="64" y="166" font-size="14" font-weight="600" fill="#18181b">Variable pay</text><text x="250" y="166" font-size="14" fill="#18181b">₹2 lakh</text><text x="380" y="166" font-size="13" fill="#71717a">Only if targets are met</text><rect x="40" y="184" width="14" height="14" rx="3" fill="#dbe6fe"/><text x="64" y="196" font-size="14" font-weight="600" fill="#18181b">Employer PF</text><text x="250" y="196" font-size="14" fill="#18181b">₹1.2 lakh</text><text x="380" y="196" font-size="13" fill="#71717a">Goes into your PF account</text><rect x="40" y="214" width="14" height="14" rx="3" fill="#d4d4d8"/><text x="64" y="226" font-size="14" font-weight="600" fill="#18181b">Gratuity</text><text x="250" y="226" font-size="14" fill="#18181b">₹0.48 lakh</text><text x="380" y="226" font-size="13" fill="#71717a">Usually only after five years</text>
  <line x1="40" y1="248" x2="680" y2="248" stroke="#e4e4e7" stroke-width="1"/>
  <text x="40" y="276" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#71717a">IN YOUR ACCOUNT EACH MONTH, AT MOST</text>
  <text x="40" y="300" font-size="20" font-weight="600" fill="#1d5ce0">₹1,36,000</text>
  <text x="150" y="300" font-size="13" fill="#71717a">before your own PF contribution, professional tax and income tax</text>
</svg>
