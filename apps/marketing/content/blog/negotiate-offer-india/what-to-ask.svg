<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 288" width="720" height="288" font-family="Outfit, system-ui, -apple-system, Segoe UI, sans-serif">
  <rect x="40" y="48" width="304" height="224" rx="16" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/><text x="60" y="76" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#1d5ce0">MONEY</text><rect x="60" y="98" width="18" height="18" rx="5" fill="none" stroke="#a9c3fb" stroke-width="2"/><text x="90" y="112" font-size="15" font-weight="600" fill="#18181b">Joining bonus</text><text x="90" y="132" font-size="12" fill="#71717a">Ask whether it's repaid if you leave early</text><rect x="60" y="154" width="18" height="18" rx="5" fill="none" stroke="#a9c3fb" stroke-width="2"/><text x="90" y="168" font-size="15" font-weight="600" fill="#18181b">Notice buyout support</text><text x="90" y="188" font-size="12" fill="#71717a">Written into the offer letter</text><rect x="60" y="210" width="18" height="18" rx="5" fill="none" stroke="#a9c3fb" stroke-width="2"/><text x="90" y="224" font-size="15" font-weight="600" fill="#18181b">Guaranteed first-year variable</text><text x="90" y="244" font-size="12" fill="#71717a">Not tied to targets you didn't set</text><rect x="376" y="48" width="304" height="224" rx="16" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/><text x="396" y="76" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#1d5ce0">TERMS</text><rect x="396" y="98" width="18" height="18" rx="5" fill="none" stroke="#a9c3fb" stroke-width="2"/><text x="426" y="112" font-size="15" font-weight="600" fill="#18181b">Title and level</text><text x="426" y="132" font-size="12" fill="#71717a">They shape your next raise and next job</text><rect x="396" y="154" width="18" height="18" rx="5" fill="none" stroke="#a9c3fb" stroke-width="2"/><text x="426" y="168" font-size="15" font-weight="600" fill="#18181b">A review in six months</text><text x="426" y="188" font-size="12" fill="#71717a">With the criteria written down</text><rect x="396" y="210" width="18" height="18" rx="5" fill="none" stroke="#a9c3fb" stroke-width="2"/><text x="426" y="224" font-size="15" font-weight="600" fill="#18181b">Remote or hybrid days</text><text x="426" y="244" font-size="12" fill="#71717a">Worth real money if they save a commute</text>
</svg>
