<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 272" width="720" height="272" font-family="Outfit, system-ui, -apple-system, Segoe UI, sans-serif">
  <rect x="40" y="72" width="208" height="14" rx="7" fill="#22345a"/><text x="40" y="56" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#a1a1aa">DAYS 1–30</text><text x="40" y="124" font-size="16" font-weight="600" fill="#fafafa">Hand over well</text><circle cx="49" cy="150" r="9" fill="#22345a"/><path d="M45.0 150 L48.0 153.5 L53.5 146.5" fill="none" stroke="#8fb3ff" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="155" font-size="13" fill="#a1a1aa">Document your work</text><circle cx="49" cy="178" r="9" fill="#22345a"/><path d="M45.0 178 L48.0 181.5 L53.5 174.5" fill="none" stroke="#8fb3ff" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="183" font-size="13" fill="#a1a1aa">Start conversations</text><rect x="256" y="72" width="208" height="14" rx="7" fill="#3a5a96"/><text x="256" y="56" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#a1a1aa">DAYS 31–60</text><text x="256" y="124" font-size="16" font-weight="600" fill="#fafafa">Interview in earnest</text><circle cx="265" cy="150" r="9" fill="#22345a"/><path d="M261.0 150 L264.0 153.5 L269.5 146.5" fill="none" stroke="#8fb3ff" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="282" y="155" font-size="13" fill="#a1a1aa">Lead with your join date</text><circle cx="265" cy="178" r="9" fill="#22345a"/><path d="M261.0 178 L264.0 181.5 L269.5 174.5" fill="none" stroke="#8fb3ff" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="282" y="183" font-size="13" fill="#a1a1aa">Compare offers on paper</text><rect x="472" y="72" width="208" height="14" rx="7" fill="#4d86ff"/><text x="472" y="56" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#a1a1aa">DAYS 61–90</text><text x="472" y="124" font-size="16" font-weight="600" fill="#fafafa">Lock the start date</text><circle cx="481" cy="150" r="9" fill="#22345a"/><path d="M477.0 150 L480.0 153.5 L485.5 146.5" fill="none" stroke="#8fb3ff" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="498" y="155" font-size="13" fill="#a1a1aa">Confirm relieving terms</text><circle cx="481" cy="178" r="9" fill="#22345a"/><path d="M477.0 178 L480.0 181.5 L485.5 174.5" fill="none" stroke="#8fb3ff" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="498" y="183" font-size="13" fill="#a1a1aa">Agree any buyout in writing</text>
