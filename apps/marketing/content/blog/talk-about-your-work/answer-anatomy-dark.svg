<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="Outfit, system-ui, -apple-system, Segoe UI, sans-serif">
  <text x="40" y="32" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#a1a1aa">ONE ANSWER, FIVE PARTS (EXAMPLE)</text>
  <circle cx="62" cy="70" r="13" fill="#22345a"/><text x="62" y="75" font-size="13" font-weight="600" text-anchor="middle" fill="#8fb3ff">1</text><text x="90" y="75" font-size="15" font-weight="600" fill="#fafafa">The problem</text><rect x="250" y="50" width="430" height="40" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/><text x="266" y="75" font-size="13" fill="#a1a1aa">Checkout was failing for some mobile users at peak hours</text><line x1="62" y1="84" x2="62" y2="110" stroke="#3f3f46" stroke-width="2"/><circle cx="62" cy="124" r="13" fill="#22345a"/><text x="62" y="129" font-size="13" font-weight="600" text-anchor="middle" fill="#8fb3ff">2</text><text x="90" y="129" font-size="15" font-weight="600" fill="#fafafa">Your part</text><rect x="250" y="104" width="430" height="40" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/><text x="266" y="129" font-size="13" fill="#a1a1aa">I owned the payments service and two engineers on it</text><line x1="62" y1="138" x2="62" y2="164" stroke="#3f3f46" stroke-width="2"/><circle cx="62" cy="178" r="13" fill="#4d86ff"/><text x="62" y="183" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">3</text><text x="90" y="183" font-size="15" font-weight="600" fill="#fafafa">The decision</text><rect x="250" y="158" width="430" height="40" rx="10" fill="#141a26" stroke="#3a5a96" stroke-width="1.5"/><text x="266" y="183" font-size="13" fill="#fafafa">Rolled back the new cache, kept the rest of the release</text><line x1="62" y1="192" x2="62" y2="218" stroke="#3f3f46" stroke-width="2"/><circle cx="62" cy="232" r="13" fill="#4d86ff"/><text x="62" y="237" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">4</text><text x="90" y="237" font-size="15" font-weight="600" fill="#fafafa">The result</text><rect x="250" y="212" width="430" height="40" rx="10" fill="#141a26" stroke="#3a5a96" stroke-width="1.5"/><text x="266" y="237" font-size="13" fill="#fafafa">Failures were back to normal within a day</text><line x1="62" y1="246" x2="62" y2="272" stroke="#3f3f46" stroke-width="2"/><circle cx="62" cy="286" r="13" fill="#22345a"/><text x="62" y="291" font-size="13" font-weight="600" text-anchor="middle" fill="#8fb3ff">5</text><text x="90" y="291" font-size="15" font-weight="600" fill="#fafafa">What you'd change</text><rect x="250" y="266" width="430" height="40" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/><text x="266" y="291" font-size="13" fill="#a1a1aa">Load-test the cache before it ever reaches users</text>
</svg>
