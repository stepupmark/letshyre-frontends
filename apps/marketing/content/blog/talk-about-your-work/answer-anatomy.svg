<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="Outfit, system-ui, -apple-system, Segoe UI, sans-serif">
  <text x="40" y="32" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#71717a">ONE ANSWER, FIVE PARTS (EXAMPLE)</text>
  <circle cx="62" cy="70" r="13" fill="#dbe6fe"/><text x="62" y="75" font-size="13" font-weight="600" text-anchor="middle" fill="#1d5ce0">1</text><text x="90" y="75" font-size="15" font-weight="600" fill="#18181b">The problem</text><rect x="250" y="50" width="430" height="40" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/><text x="266" y="75" font-size="13" fill="#71717a">Checkout was failing for some mobile users at peak hours</text><line x1="62" y1="84" x2="62" y2="110" stroke="#e4e4e7" stroke-width="2"/><circle cx="62" cy="124" r="13" fill="#dbe6fe"/><text x="62" y="129" font-size="13" font-weight="600" text-anchor="middle" fill="#1d5ce0">2</text><text x="90" y="129" font-size="15" font-weight="600" fill="#18181b">Your part</text><rect x="250" y="104" width="430" height="40" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/><text x="266" y="129" font-size="13" fill="#71717a">I owned the payments service and two engineers on it</text><line x1="62" y1="138" x2="62" y2="164" stroke="#e4e4e7" stroke-width="2"/><circle cx="62" cy="178" r="13" fill="#266fff"/><text x="62" y="183" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">3</text><text x="90" y="183" font-size="15" font-weight="600" fill="#18181b">The decision</text><rect x="250" y="158" width="430" height="40" rx="10" fill="#f3f7ff" stroke="#a9c3fb" stroke-width="1.5"/><text x="266" y="183" font-size="13" fill="#18181b">Rolled back the new cache, kept the rest of the release</text><line x1="62" y1="192" x2="62" y2="218" stroke="#e4e4e7" stroke-width="2"/><circle cx="62" cy="232" r="13" fill="#266fff"/><text x="62" y="237" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">4</text><text x="90" y="237" font-size="15" font-weight="600" fill="#18181b">The result</text><rect x="250" y="212" width="430" height="40" rx="10" fill="#f3f7ff" stroke="#a9c3fb" stroke-width="1.5"/><text x="266" y="237" font-size="13" fill="#18181b">Failures were back to normal within a day</text><line x1="62" y1="246" x2="62" y2="272" stroke="#e4e4e7" stroke-width="2"/><circle cx="62" cy="286" r="13" fill="#dbe6fe"/><text x="62" y="291" font-size="13" font-weight="600" text-anchor="middle" fill="#1d5ce0">5</text><text x="90" y="291" font-size="15" font-weight="600" fill="#18181b">What you'd change</text><rect x="250" y="266" width="430" height="40" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/><text x="266" y="291" font-size="13" fill="#71717a">Load-test the cache before it ever reaches users</text>
</svg>
