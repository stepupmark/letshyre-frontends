<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" font-family="Outfit, system-ui, -apple-system, Segoe UI, sans-serif">
  <line x1="80" y1="130" x2="620" y2="130" stroke="#3f3f46" stroke-width="4" stroke-linecap="round"/>
  <line x1="80" y1="130" x2="360" y2="130" stroke="#4d86ff" stroke-width="4" stroke-linecap="round"/>
  <text x="220" y="118" font-size="13" font-weight="600" text-anchor="middle" fill="#6b9bff">90 days in the talent pool</text>
  <circle cx="80" cy="130" r="11" fill="#4d86ff"/>
  <circle cx="360" cy="130" r="11" fill="#18181b" stroke="#4d86ff" stroke-width="3"/>
  <circle cx="620" cy="130" r="9" fill="#18181b" stroke="#3f3f46" stroke-width="3"/>
  <text x="80" y="88" font-size="12" font-weight="600" text-anchor="middle" fill="#a1a1aa">DAY 1</text>
  <text x="360" y="88" font-size="12" font-weight="600" text-anchor="middle" fill="#a1a1aa">DAY 90</text>
  <text x="620" y="88" font-size="12" font-weight="600" text-anchor="middle" fill="#a1a1aa">LATER</text>
  <text x="60" y="178" font-size="15" font-weight="600" fill="#fafafa">In front of employers</text>
  <text x="60" y="200" font-size="13" fill="#a1a1aa">Matched to roles that fit,</text>
  <text x="60" y="218" font-size="13" fill="#a1a1aa">and you can update the profile</text>
  <text x="340" y="178" font-size="15" font-weight="600" fill="#fafafa">Leaves the pool</text>
  <text x="340" y="200" font-size="13" fill="#a1a1aa">Employers don't chase</text>
  <text x="340" y="218" font-size="13" fill="#a1a1aa">people who stopped looking</text>
  <text x="680" y="178" font-size="15" font-weight="600" text-anchor="end" fill="#fafafa">Come back</text>
  <text x="680" y="200" font-size="13" text-anchor="end" fill="#a1a1aa">with a new profile</text>
  <text x="680" y="218" font-size="13" text-anchor="end" fill="#a1a1aa">whenever you like</text>
</svg>
