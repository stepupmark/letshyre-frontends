# /etc/nginx/sites-available/letshyre-frontend
# TLS ends at the ALB, which forwards plain HTTP here. Needs
# deploy/letshyre-headers.conf in /etc/nginx/snippets/. Point the target group
# health check at /health, then `sudo nginx -t && sudo systemctl reload nginx`.

server {
  listen 80;
  listen [::]:80;
  server_name letshyre.com www.letshyre.com;

  root /var/www/letshyre;
  absolute_redirect off;
  server_tokens off;

  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

  # A location with its own add_header drops the server's, so each re-includes these.
  include snippets/letshyre-headers.conf;
  error_page 404 /404.html;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  location = /404.html {
    internal;
  }

  location = / {
    return 301 /en$is_args$args;
  }

  rewrite ^/(.+)/$ /$1 permanent;

  location ^~ /assets/ {
    include snippets/letshyre-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Loader data for client-side navigation between prerendered pages.
  location ~ \.data$ {
    include snippets/letshyre-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location ~* \.(?:ico|png|jpe?g|webp|svg|mp4|webmanifest)$ {
    include snippets/letshyre-headers.conf;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # Prerendered pages, one set per locale (app/i18n/config.js).
  location ~ "^/(en|hi|fr|ja|ar|te|ta|es|nl|ru|kn|ml|ur|bn|de|pt|it|ko|id)(/|$)" {
    include snippets/letshyre-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri/index.html @missing_translation;
  }

  # Page not built in this locale yet (e.g. pricing): fall back to English.
  location @missing_translation {
    rewrite "^/(?!en/)[a-z]{2}/(about|contact|download|how-it-works-interview|pricing|terms|policy|refund-policy)$" /en/$1 redirect;
    return 404;
  }

  # Client-rendered routes. A new top-level route has to be added here.
  location ~ ^/(employer|employee|shared-scorecard|get-started|forgot-password)(/|$) {
    include snippets/letshyre-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow";
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }

  location / {
    try_files $uri =404;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name www.letshyre.ai;
  return 301 https://letshyre.ai$request_uri;
}
