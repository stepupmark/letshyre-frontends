# letshyre.ai from Phase 4 until the app moves to app.letshyre.ai (Phase 7).
# Marketing pages come from the new build. App routes come from the new app when they are
# listed in its live-routes.map, otherwise from the legacy build.
# TLS ends at the ALB. Layout on disk: infra/nginx/README.md.

map $request_uri $request_path {
  "~^(?<path>[^?]*)" $path;
}

# /hi/pricing -> /en/pricing, for pages not translated yet
map $request_path $english_path {
  "~^/[a-z]{2}(?<rest>(/[a-z-]+)?)$" /en$rest;
}

map $request_path $marketing_csp {
  include /var/www/letshyre/marketing/current/csp.map;
}

# 1 for paths the new app serves; app releases change it, so reload after each one
map $request_path $app_live {
  default 0;
  include /var/www/letshyre/app/current/live-routes.map;
}

map $request_path $app_csp {
  include /var/www/letshyre/app/current/csp.map;
}

server {
  listen 80;
  listen [::]:80;
  server_name letshyre.ai;

  root /var/www/letshyre/marketing/current/client;
  absolute_redirect off;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml text/x-script;

  error_page 404 /404/index.html;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  location = / {
    return 301 /en$is_args$args;
  }

  rewrite ^/(.+)/$ /$1 permanent;

  # Hashed names never collide, so marketing and legacy chunks share /assets/.
  # Deploys add to the shared folder, so tabs on an old release keep loading.
  location ^~ /assets/ {
    root /var/www/letshyre/marketing;
    include snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri @app_assets;
  }

  location @app_assets {
    root /var/www/letshyre/app;
    include snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri @legacy_assets;
  }

  location @legacy_assets {
    root /var/www/letshyre/legacy;
    include snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # loader data for client-side navigation
  location ~ \.data$ {
    include snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location ~ "^/(en|hi|fr|ja|ar|te|ta|es|nl|ru|kn|ml|ur|bn|de|pt|it|ko|id)(/[a-z-]+)?$" {
    include snippets/marketing-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri/index.html @missing_translation;
  }

  # Not translated yet: send to English while it exists. 302, since it turns
  # into a 200 once the locale is ready.
  location @missing_translation {
    if (-f $document_root$english_path/index.html) {
      return 302 $english_path$is_args$args;
    }
    return 404;
  }

  # read by legacy so its own links hand migrated pages over to the new app
  location = /live-routes.json {
    root /var/www/letshyre/app/current/client;
    include snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location ~ ^/(employer|employee|get-started|forgot-password|shared-scorecard|sign-in)(/|$) {
    error_page 418 = @app;
    if ($app_live) {
      return 418;
    }
    root /var/www/letshyre/legacy/current/client;
    include snippets/legacy-headers.conf;
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }

  location @app {
    root /var/www/letshyre/app/current/client;
    include snippets/app-headers.conf;
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }

  location ~* \.(?:ico|png|jpe?g|webp|avif|svg|mp4|webmanifest|woff2)$ {
    include snippets/marketing-headers.conf;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri @legacy_static;
  }

  location / {
    include snippets/marketing-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri @legacy_static;
  }

  # public files only the dashboards use (images, the interview video)
  location @legacy_static {
    root /var/www/letshyre/legacy/current/client;
    include snippets/legacy-headers.conf;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name www.letshyre.ai;
  return 301 https://letshyre.ai$request_uri;
}
