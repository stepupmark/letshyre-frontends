# The candidate photo needs the camera. Razorpay runs in its own frame, so the app
# itself is never framed.
include snippets/security-headers.conf;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
# script hashes from the build; switch to CSP_ENFORCE=true after a clean week
add_header Content-Security-Policy-Report-Only $app_csp always;
add_header X-Robots-Tag "noindex, nofollow" always;
