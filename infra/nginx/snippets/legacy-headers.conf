# Interviews need the camera and mic, and Razorpay posts its own forms, so no
# Permissions-Policy or form-action here.
include snippets/security-headers.conf;
add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
add_header X-Robots-Tag "noindex, nofollow" always;
