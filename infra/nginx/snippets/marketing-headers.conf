include snippets/security-headers.conf;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
# per-page script hashes from the build; switch to CSP_ENFORCE=true after a clean week
add_header Content-Security-Policy-Report-Only $marketing_csp always;
