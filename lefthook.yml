output:
  - failure
  - summary

pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,tsx,js,mjs,cjs,json,css,md,yml,yaml}"
      exclude:
        - "apps/legacy/**"
        - "docs/baseline/**"
      run: pnpm prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit "{1}"

pre-push:
  commands:
    check:
      run: pnpm turbo run lint typecheck --affected
