packages:
  - apps/*
  - packages/*

catalog:
  "@axe-core/playwright": ^4.13.0
  "@base-ui/react": ^1.8.0
  "@fontsource-variable/outfit": ^5.3.0
  "@hookform/resolvers": ^5.9.1
  "@playwright/test": ^1.63.0
  "@react-router/dev": 8.4.0
  "@react-router/fs-routes": 8.4.0
  "@react-router/node": 8.4.0
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-query": ^5.104.1
  "@tanstack/react-table": ^9.2.4
  "@testing-library/jest-dom": ^6.9.1
  "@testing-library/react": ^16.3.3
  "@testing-library/user-event": ^14.6.7
  "@types/node": ^24.19.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitest/coverage-v8": ^5.0.3
  eslint: ^10.11.0
  i18next: ^26.4.2
  isbot: ^5.2.2
  jsdom: ^30.0.1
  lucide-react: ^1.50.0
  msw: ^2.15.0
  next-themes: ^0.4.6
  react: ^19.2.8
  react-dom: ^19.2.8
  react-hook-form: ^7.89.0
  react-router: 8.4.0
  recharts: ^3.8.0
  sonner: ^2.0.8
  tailwindcss: ^4.3.3
  typescript: ~6.0.3
  vite: ^8.3.2
  vitest: ^5.0.3
  zod: ^4.6.5

# don't install versions published in the last 24h
minimumReleaseAge: 1440

onlyBuiltDependencies:
  - esbuild
  - lefthook
  - sharp

peerDependencyRules:
  allowedVersions:
    eslint-plugin-jsx-a11y>eslint: "10"
    eslint-plugin-react>eslint: "10"

# jest-dom augments "vitest" types; without the peer it binds to whichever copy is hoisted
packageExtensions:
  "@testing-library/jest-dom":
    peerDependencies:
      vitest: "*"
    peerDependenciesMeta:
      vitest:
        optional: true
